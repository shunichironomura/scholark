name: Build Docker Images
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-compose-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Run Docker Compose Build
        run: |
          docker compose build

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: frontend
          cache: true

      - name: Test frontend production container
        working-directory: frontend
        run: |
          SCHOLARK_TEST_IMAGE="$(docker compose build --print | jq -er '.target.frontend.tags[0]')"
          export SCHOLARK_TEST_IMAGE
          vp test run integration/container.test.ts

  collect-docker-build:
    needs: [docker-compose-build]
    runs-on: ubuntu-latest
    steps:
      - name: Collect results
        run: echo "Docker images built successfully."
