name: Lint Frontend
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  vp-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: frontend
          cache: true

      - name: Generate React Router types
        run: vp exec react-router typegen

      - name: Run Vite+ check
        run: vp check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: frontend
          cache: true

      - name: Run TypeScript type checking
        run: vp run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: frontend
          cache: true

      - name: Build the frontend
        run: vp run build

  vp-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: frontend
          cache: true

      - name: Run Vite+ tests
        run: vp test

  collect-lint-frontend:
    needs: [vp-check, typecheck, build, vp-test]
    runs-on: ubuntu-latest
    steps:
      - name: Collect results
        run: echo "All checks passed!"
        working-directory: .
