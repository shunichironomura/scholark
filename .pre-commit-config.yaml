repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
    hooks:
      # Run the linter.
      - id: ruff
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude_types: [html, svg]
        exclude: "frontend/app/client/.*|frontend/components\\.json|backend/alembic/README"
      - id: check-toml
      - id: check-yaml
        args: ["--allow-multiple-documents", "--unsafe"]
      - id: check-json
        exclude: "\\.vscode/launch\\.json|\\.zed/settings\\.json"
      - id: check-added-large-files
        args: ["--enforce-all"]
      - id: check-merge-conflict
      - id: check-symlinks
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: fix-byte-order-marker
      - id: forbid-submodules
      - id: no-commit-to-branch

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 46787482b9fb2003c56e0f7592e312ef381829d9  # frozen: 0.13.6
    hooks:
      - id: uv-lock
        files: backend/pyproject.toml
        args: [--project, backend]
